<?xml version="1.0" encoding="UTF-8"?>
<!-- RC Revenge Pro: Re-Amped launcher icon. Original artwork for this project (not the game's), GPL-3.0 like the rest. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252e"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff4d1f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <!-- speed streaks -->
  <g fill="url(#hot)" opacity="0.85">
    <rect x="28" y="150" width="64" height="8" rx="4"/>
    <rect x="16" y="168" width="84" height="8" rx="4"/>
    <rect x="34" y="186" width="56" height="8" rx="4"/>
  </g>
  <!-- a small buggy seen from the side: body, wing, two big wheels -->
  <path d="M96 168 L120 132 L178 126 L214 146 L222 168 Z" fill="url(#hot)"/>
  <path d="M146 130 L156 108 L188 110 L176 128 Z" fill="#ffd27a"/>
  <rect x="104" y="104" width="34" height="8" rx="3" fill="#ff4d1f" transform="rotate(-8 121 108)"/>
  <rect x="117" y="108" width="5" height="26" fill="#ff4d1f"/>
  <circle cx="122" cy="176" r="26" fill="#0b0c10" stroke="#3a3f4c" stroke-width="6"/>
  <circle cx="122" cy="176" r="9" fill="#ffb020"/>
  <circle cx="200" cy="176" r="26" fill="#0b0c10" stroke="#3a3f4c" stroke-width="6"/>
  <circle cx="200" cy="176" r="9" fill="#ffb020"/>
  <!-- RC lettering -->
  <text x="128" y="84" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-style="italic" font-size="68" fill="#f2f2f5" letter-spacing="2">RC</text>
  <text x="128" y="228" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-size="20" fill="#ffb020" letter-spacing="3">RE-AMPED</text>
</svg>
